name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.13.7"

jobs:
  python:
    name: Python lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests tools demo
      - run: uv run ruff format --check src tests tools demo
      - run: uv run mypy
      - run: uv run pytest -q -m "not requires_db and not e2e"

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: conductor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor -d conductor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgresql+asyncpg://conductor:ci-only-password@localhost:5432/conductor_test
      CONDUCTOR_SESSION_SECRET: ci-generated-session-signing-value
      CONDUCTOR_INTERNAL_TOKEN: ci-generated-internal-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - run: uv sync --extra dev
      - run: uv run pytest -q -m requires_db

  portal:
    name: Portal tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build

  privacy:
    name: Privacy and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Public CI has no private denylist. --public-ci only relaxes that
      # requirement; it never weakens the generic checks or allows a push.
      - run: python tools/privacy/scan.py --scope tree --scope history --public-ci
      - name: Install pinned Gitleaks
        run: bash tools/privacy/install_gitleaks.sh /tmp/gitleaks-bin
      - name: Gitleaks
        run: /tmp/gitleaks-bin/gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .

  clean-export:
    name: Clean export build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Export exact commit
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/export"
      - name: Python tests without private files
        working-directory: ${{ runner.temp }}/export
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --extra dev
          uv run pytest -q -m "not requires_db and not e2e"
      - name: Portal build without private files
        working-directory: ${{ runner.temp }}/export/apps/portal
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Scan generated outputs
        working-directory: ${{ runner.temp }}/export
        run: python tools/privacy/scan.py --scope tree --public-ci
