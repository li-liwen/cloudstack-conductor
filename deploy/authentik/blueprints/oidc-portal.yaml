# Authentik blueprint: portal OIDC client (generic template).
#
# Review against the deployment's Authentik version before importing. Values in
# !Env are supplied privately at import time; do not put secrets in this file.
version: 1
metadata:
  name: conductor-portal-oidc
  labels:
    blueprints.goauthentik.io/description: Portal OIDC client for CloudStack Conductor
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: conductor-portal-provider
    identifiers:
      name: conductor-portal
    attrs:
      name: conductor-portal
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env [CONDUCTOR_PORTAL_OIDC_CLIENT_ID, ""]
      client_secret: !Env [CONDUCTOR_PORTAL_OIDC_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: !Env [CONDUCTOR_PORTAL_OIDC_REDIRECT_URI, "https://portal.example.com/api/v1/auth/callback"]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "profile"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: hours=1
      refresh_token_validity: days=30
  - model: authentik_core.application
    id: conductor-portal-app
    identifiers:
      slug: conductor-portal
    attrs:
      name: CloudStack Conductor
      provider: !KeyOf conductor-portal-provider
      meta_launch_url: !Env [CONDUCTOR_PUBLIC_BASE_URL, "https://portal.example.com"]
      policy_engine_mode: any
