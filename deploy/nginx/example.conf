# Example reverse-proxy configuration (generic placeholders)

This file is a starting point for the private deployment's TLS terminator. It
contains no real hostnames, addresses, certificates, or credentials. Replace
every `example.com` name and upstream with the deployment's private values.

```nginx
# Portal + API. SSE and WebSocket routes must not be buffered.
server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.com;

    ssl_certificate     /etc/nginx/tls/portal.crt;
    ssl_certificate_key /etc/nginx/tls/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz { proxy_pass http://api:8000/healthz; }
    location = /readyz  { proxy_pass http://api:8000/readyz; }

    location / {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

# MCP must forward the whole hostname, not only /mcp: OAuth discovery,
# authorization, callback, token, and revocation paths all live under it.
server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/nginx/tls/mcp.crt;
    ssl_certificate_key /etc/nginx/tls/mcp.key;

    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://mcp:8083;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
```

Notes:

- Keep published upstream ports restricted to the proxy and health checks at
  the host firewall, including Docker's actual forwarding path.
- Use internal DNS or private host mappings so canonical HTTPS names resolve
  from the application server when needed.
- Do not route console WebSockets to arbitrary upstreams; the console broker
  validates a host/port allowlist before relaying.
- An ACME/HTTP challenge location is deployment-specific and intentionally not
  included.
