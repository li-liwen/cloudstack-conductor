# Example edge-proxy injection for the CloudStack UI (placeholders only).
# Serve the reviewed runtime scripts from the private origin, not a CDN.
# Review the upstream CSP; prefer a nonce/hash over unsafe-inline.

server {
    listen 443 ssl;
    http2 on;
    server_name cloud.example.com;

    # Private TLS configuration omitted.

    location / {
        proxy_pass http://cloudstack-ui-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_once off;
        sub_filter_types text/html;
        # Load the public config first, then the reviewed scripts.
        sub_filter '</head>' '<script src="/__conductor/config.js"></script><script src="/__conductor/sso-entry.js" defer></script><script src="/__conductor/console-launch.js" defer></script></head>';
    }

    # These private static files are mounted read-only from the deployment.
    location /__conductor/ {
        alias /srv/conductor/cloudstack-ui/;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }
}
