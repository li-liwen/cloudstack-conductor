[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloudstack-conductor"
version = "0.1.0"
description = "A tenant-aware agent and MCP control plane for Apache CloudStack."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "CloudStack Conductor contributors" }]
keywords = ["cloudstack", "agents", "mcp", "multi-tenant", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "fastapi==0.162.2",
  "fastmcp==4.1.6",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "openpyxl==3.1.5",
  "pgvector==0.5.1",
  "procrastinate==3.10.0",
  "psycopg[binary]>=3.2",
  "prometheus-client==0.26.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "PyJWT==2.15.1",
  "python-multipart==0.0.33",
  "PyYAML==6.0.3",
  "sqlalchemy[asyncio]==2.1.8",
  "tenacity==9.2.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==6.2.0"]
browser = ["playwright>=1.55"]
dev = [
  "coverage[toml]>=7.7",
  "mypy>=1.14",
  "openpyxl==3.1.5",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "respx==0.23.1",
  "aiosqlite>=0.21",
  "ruff>=0.9",
]

[project.scripts]
conductor-api = "conductor.api.main:run"
conductor-execution = "conductor.execution.main:run"
conductor-worker = "conductor.worker.main:main"
conductor-mcp = "conductor.mcp.main:run"
conductor-embeddings = "conductor.embeddings.main:run"
conductor-usage = "conductor.usage.collector:main"
conductor-admin = "conductor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[tool.hatch.build.targets.sdist]
include = ["src/conductor", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that need a database or running services",
  "e2e: browser/end-to-end tests",
  "requires_db: tests that need PostgreSQL",
]
filterwarnings = [
  "error::DeprecationWarning:conductor.*",
  "ignore::DeprecationWarning:websockets.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "SIM105", # contextlib.suppress is not always clearer
  "RUF001", # ambiguous Unicode in user-facing Mandarin strings
  "RUF002",
  "RUF003",
  "ASYNC240", # blocking reads of small trusted config files are acceptable
  "SIM102",
  "SIM108",
  "RUF007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["conductor"]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["conductor.cloudstack.client"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "procrastinate.*", "langgraph.*", "fastmcp.*", "pgvector.*", "openpyxl.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["conductor"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
